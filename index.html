<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buzzer Lab</title>
<meta name="description" content="Science Bowl practice with official DOE rounds, a buzzer, and progress tracking.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#EEF2F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1420" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Buzzer Lab">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: competition console. Slim header with tabs, one working column; the buzzer is the single loud element. */
:root{
  --bg:#EEF2F6; --surface:#FFFFFF; --sunk:#E4E9F0; --ink:#152033; --muted:#566278; --line:#D3DAE4;
  --accent:#D23E2A; --accent-ink:#FFFFFF; --lab:#1C4E8A; --on-lab:#FFFFFF; --good:#1B7A4A; --bad:#B42318; --warn:#9A5B00;
  --c-life:#2C7A4B; --c-physical:#1D62B5; --c-chem:#7E47B5; --c-physics:#1D62B5; --c-earth:#946016; --c-energy:#C2410C; --c-math:#4A5568; --c-general:#0F766E; --c-other:#6B7280;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E1420; --surface:#162032; --sunk:#111A29; --ink:#E5EAF2; --muted:#9AA6BA; --line:#283449;
  --accent:#F0614B; --accent-ink:#1A0B07; --lab:#86B4F2; --on-lab:#0E1420; --good:#4BC489; --bad:#F38B80; --warn:#E3A64A;
  --c-life:#5FC98A; --c-physical:#7DB2F5; --c-chem:#B990EA; --c-physics:#7DB2F5; --c-earth:#D9A35A; --c-energy:#F58C55; --c-math:#A8B3C6; --c-general:#4FD1C5; --c-other:#9CA3AF;
  color-scheme:dark;}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent;padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:var(--lab)}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:820px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.lamp{width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.brand b{font:800 22px var(--f-display);font-stretch:85%;letter-spacing:.01em}
nav.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px}
nav.tabs button{border:0;background:transparent;color:var(--muted);font:700 14px var(--f-body);padding:7px 14px;border-radius:999px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}
main{max-width:820px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px));padding-block:22px 56px}
:focus-visible{outline:2px solid var(--lab);outline-offset:2px}
h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h2{font-size:26px;font-weight:800;font-stretch:90%;line-height:1.2}
h3{font-size:17px;font-weight:700}
p{margin:0}
.eyebrow{font:700 12px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lead{font-size:17px}
.maxw{max-width:62ch;margin-top:6px}
.muted{color:var(--muted)} .small{font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:flex;flex-direction:column;gap:18px}
.stack.tight{gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between} .end{align-items:flex-end}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 15px var(--f-body);padding:10px 16px;border-radius:9px;cursor:pointer;text-decoration:none;min-height:44px}
.btn.small{font-size:14px;padding:6px 12px;min-height:36px}
.btn.primary{background:var(--lab);border-color:var(--lab);color:var(--on-lab)}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font:800 17px var(--f-display);letter-spacing:.02em;padding:12px 22px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
fieldset{border:0;margin:0;padding:0;min-width:0;display:flex;flex-direction:column;gap:8px}
legend{padding:0;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:700;color:var(--muted);background:var(--surface);min-height:38px}
.chip input:checked+span{color:var(--ink);border-color:var(--ink);background:var(--sunk)}
.chip input:focus-visible+span{outline:2px solid var(--lab);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px}
select,textarea,input[type=text]{font:16px var(--f-body);padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);width:100%;min-width:0}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--lab)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--cc,var(--muted));flex:none}
.c-life{--cc:var(--c-life)} .c-physical{--cc:var(--c-physical)} .c-chem{--cc:var(--c-chem)} .c-physics{--cc:var(--c-physics)} .c-earth{--cc:var(--c-earth)} .c-energy{--cc:var(--c-energy)} .c-math{--cc:var(--c-math)} .c-general{--cc:var(--c-general)} .c-other{--cc:var(--c-other)}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
details.howto summary,details.set summary{cursor:pointer;list-style:none}
details.howto summary::-webkit-details-marker,details.set summary::-webkit-details-marker{display:none}
details.howto p{margin-top:10px;font-size:15px;color:var(--muted);max-width:65ch}
details.howto p b{color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.stat .v{font:700 26px var(--f-mono);font-variant-numeric:tabular-nums;line-height:1.2}
.stat .k{font-size:13px;color:var(--muted)}
/* play */
.tag{display:inline-flex;align-items:center;gap:10px;font:700 13px var(--f-display);letter-spacing:.08em;text-transform:uppercase;flex-wrap:wrap}
.tag .kind{padding:3px 8px;border-radius:5px;background:var(--sunk)}
.tag .kind.b{background:var(--lab);color:var(--on-lab)}
.tag .cat{display:inline-flex;align-items:center;gap:6px;color:var(--cc)}
.score{font:700 15px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.score b{color:var(--ink);font-size:20px}
.qtext{font-size:21px;line-height:1.55;min-height:7em}
.qtext .fmt{font-weight:700;font-style:italic;color:var(--muted)}
.qtext .choice{display:block;margin-top:6px}
.qtext .hid{visibility:hidden}
.listening{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:18px;min-height:6em}
.wave{display:inline-flex;gap:4px;align-items:center;height:24px}
.wave i{width:4px;height:100%;border-radius:2px;background:var(--lab);animation:w 1s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}.wave i:nth-child(4){animation-delay:.45s}
@keyframes w{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.clockbar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:14px}
.clockbar div{height:100%;width:0;background:var(--lab);transition:width .1s linear}
.clockbar.urgent div{background:var(--accent)}
.clockrow{display:flex;justify-content:space-between;margin-top:6px;font:500 13px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.buzz-zone{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 0 4px}
.buzzer{width:min(46vw,170px);aspect-ratio:1;max-width:100%;border-radius:50%;border:0;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--accent) 65%,#fff) 0,var(--accent) 45%,color-mix(in srgb,var(--accent) 70%,#000) 100%);
  color:var(--accent-ink);font:800 28px var(--f-display);font-stretch:85%;letter-spacing:.06em;
  box-shadow:0 8px 0 color-mix(in srgb,var(--accent) 55%,#000),0 12px 24px rgb(0 0 0/.18);transition:transform .06s,box-shadow .06s}
.buzzer:active{transform:translateY(6px);box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 55%,#000),0 4px 10px rgb(0 0 0/.18)}
.kbd{font:600 12px var(--f-mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 6px}
@media (hover:none){.hide-touch{display:none}}
.answer-now{font:800 15px var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.mc{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:10px}
.mc button{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:14px;font:16px var(--f-body);cursor:pointer;min-width:0;min-height:52px}
.mc .L{font:800 16px var(--f-mono);color:var(--lab);flex:none}
.sa{display:flex;gap:10px;flex-wrap:wrap}
.sa input{flex:1 1 200px;min-width:0;font:18px var(--f-body);padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink)}
.result{border-radius:var(--r);padding:16px;border:1px solid var(--line);background:var(--sunk);display:flex;flex-direction:column;gap:8px}
.result .verdict{font:800 22px var(--f-display);font-stretch:90%}
.result.ok .verdict{color:var(--good)} .result.no .verdict{color:var(--bad)} .result.skip .verdict{color:var(--muted)}
.ans{font-size:17px;overflow-wrap:anywhere}
.ans b{font:700 12px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:8px}
.wrap-gap{margin-top:4px}
/* progress */
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:minmax(0,150px) minmax(60px,1fr) auto;gap:10px;align-items:center}
.bar-row .name{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;min-width:0;line-height:1.25}
.track{height:12px;background:var(--sunk);border-radius:6px;overflow:hidden}
.track div{height:100%;background:var(--cc);border-radius:6px}
.bar-row .pct{font:600 13px var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;color:var(--muted)}
.bar-row .pct b{color:var(--ink)}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th{font:700 12px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
td:first-child{display:flex;gap:8px;align-items:center;font-weight:700}
td:not(:first-child),th:not(:first-child){text-align:right;font-family:var(--f-mono);font-size:14px}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;min-width:300px;height:auto}
.axis{font:11px var(--f-mono);fill:var(--muted)} .axis.strong{fill:var(--ink);font-weight:700}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:flex-start}
.item:first-child{border-top:0}
.item .body{min-width:0;flex:1}
.item .q{font-size:15px;overflow-wrap:anywhere}
.item .a{font-size:14px;color:var(--muted);margin-top:3px}
details summary{cursor:pointer;color:var(--lab);font-weight:700}
.item details summary{font-size:14px}
.pill{font:700 12px var(--f-mono);padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.good{color:var(--good)} .pill.bad{color:var(--bad)}
.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
/* rounds */
details.set{border-top:1px solid var(--line);padding-top:12px}
details.set summary{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--ink);font-weight:400}
.rlist{display:flex;flex-direction:column;margin-top:8px}
.rrow{display:flex;align-items:center;gap:8px;padding:6px 0;flex-wrap:wrap}
.rrow span:first-child{margin-right:auto;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:9px;font-size:14px;z-index:20;max-width:calc(100vw - 32px)}
@media (max-width:520px){h2{font-size:23px}.qtext{font-size:19px}.stat .v{font-size:21px}.bar-row{grid-template-columns:minmax(0,108px) minmax(50px,1fr) auto}td,th{padding-inline:5px}td:not(:first-child){font-size:13px}.brand b{font-size:20px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><div class="lamp" aria-hidden="true"></div><b>Buzzer Lab</b></div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="practice" aria-selected="true">Practice</button>
    <button role="tab" data-tab="progress" aria-selected="false">Progress</button>
    <button role="tab" data-tab="rounds" aria-selected="false">Rounds</button>
  </nav>
</div></header>
<main id="app"><div class="empty">Loading…</div></main>
<div class="toast" id="toast" hidden></div>
<script src="js/catalog.js"></script>
<script src="js/parser.js"></script>
<script src="js/app.js"></script>
</body>
</html>
